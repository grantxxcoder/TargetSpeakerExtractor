# AB-SDR: the ARTEFACT-WEIGHTED objective, fine-tuned from e21. ARTEFACT + INTERFERENCE.
#
# THE 2x2. Four runs, identical apart from two loss weights:
#   bsrnn_interf_ft_control.yaml   w_interf 1.0  w_artif 1.0   (run 2026-10-02)
#   bsrnn_interf_ft.yaml           w_interf 2.0  w_artif 1.0   (run 2026-10-02)
#   bsrnn_artif_ft.yaml            w_interf 1.0  w_artif 4.0
#   bsrnn_interf_artif_ft.yaml     w_interf 2.0  w_artif 4.0
# This file and bsrnn_artif_ft.yaml differ in loss.w_interf only. Same start (e21),
# fresh optimiser, seed and data order as the 2026-10-02 pair. Compare within
# the 2x2, never with e21. decisions-m2.md 2026-10-03.
#
# WHAT CHANGES. L_pres's error splits exactly into three orthogonal BSS_EVAL
# parts (Vincent et al. 2006): the other speaker, the noise, and the artefact
# that no source explains. The artefact part is counted w_artif times:
#
#   L_pres_w = -10 log10( |P_s y|^2 / (|y - P_s y|^2 + (w_interf - 1) |e_interf|^2
#                                      + (w_artif - 1) |e_artif|^2 + tau |P_s y|^2) )
#
# This is AB-SDR (Ochiai et al., IEEE/ACM TASLP 32, 2024, eq. 18), BORROWED
# WITH A DIFFERENCE: it sits inside the floored SI-SDR L_pres, not plain SDR.
# The noise stem is recovered as mixture - target - other (exact on every
# example; dataset_loader._remix). src/models/losses.py::_artefact_part.
#
# WHY w_artif 4.0. An ENERGY weight. Ochiai's alpha multiplies the error inside
# the norm, so their multi-talker alpha = 2.0 is 4.0 here (a test pins this).
# Not tuned: one slot before the 2026-10-14 freeze. NOTE w_interf 2.0 is ALSO
# an energy weight, i.e. alpha = 1.41 in Ochiai's convention -- the 2026-10-02
# configs' "Ochiai's weight is 2.0" compared different conventions.
#
# FOUR OTHER DIFFERENCES FROM e21's CONFIG, identical in all four files and all
# forced by fine-tuning:
#   training.init_weights   start from e21 (saved weights-only, so --resume cannot)
#   training.lr 1.25e-4     e21's own lr at epoch 21 (its history.csv)
#   training.epochs 6       2,836-2,913 s/epoch measured on the 2026-10-02 pair
#   loss.w_schedule DELETED it would hold w at 0 for the first 6,632 steps,
#                           switching the silence term off for two epochs and
#                           undoing what e21 learned.
#
# Everything below is bsrnn_cue_context.yaml verbatim apart from those keys.

seed: 42

data:
  sample_rate: 16000    # read by the loss (windows_ms -> n_fft) and the loader
  chunk_s: 4.008        # decisions-m1.md 2026-08-18 (CARTSE) gave 4.0; the extra
                        # 8 ms is a SPEED fix, not a modelling one. fp16
                        # tensor-core LSTM kernels need the batch dimension to be
                        # a multiple of 8; band_rnn's batch is examples x T, and
                        # 4.0 s gives T=503 (prime), so only batch sizes
                        # divisible by 4 aligned. 4.008 s gives T=504 = 8 x 63,
                        # so EVERY batch size aligns. Measured 2026-08-28:
                        # 2.993 -> 0.674 s/step at batch 3, a 4.44x speedup, for
                        # a 0.2 % LONGER crop. decisions-pending.md E3f.
  both_directions: true   # Train every trial TWICE: the same mixture asked for
                        # the target, then for the other speaker. The only thing
                        # in the data that makes reading the enrollment
                        # compulsory -- with one direction, a model that ignores
                        # it can fit every example, and measured, it did (output
                        # moved 8 % on an enrollment swap). Needs interferer.wav
                        # and interferer_enrollment.wav, so the split must be
                        # rendered after 2026-08-26. NOTE batch_size then counts
                        # TRIALS: a step sees 2x that many examples.
                        # decisions-m2.md 2026-08-26.
  enrollment_variants: 3  # 4 until 2026-08-31; lowered to 3 to buy upload budget
                        # for the 5,000-trial render. The bank costs
                        # (K-1) x 2 x ~160 kB per trial, so K=4 -> K=3 saves
                        # 320 kB/trial, ~1.6 GB at 5,000 trials. Untested whether
                        # 3 rotations regularise as well as 4 -- the arm that
                        # measured the bank used K=4 (decisions-m2.md 2026-08-30),
                        # so this is a change to a measured setting and the run
                        # cannot be compared to that arm on the bank axis alone.
                        # Enrollment bank size, TRAINING ONLY -- val always
                        # reads variant 0, which IS enrollment.wav, so val stays
                        # comparable with every run before the bank existed.
                        # 1 = the single rendered clip, i.e. every run up to
                        # 2026-08-29. >1 rotates through K distinct utterances by
                        # the same speaker, one per epoch, so the identity cue
                        # stops being a fixed waveform to memorise. Requires
                        # scripts/render_enrollment_bank.py to have run on the
                        # split. decisions-m2.md 2026-08-30.
  remix_gains: true    # Rebuild the mixture each epoch at another trial's SIR
                        # and SNR, drawn from the same difficulty regime. TRAIN
                        # ONLY -- a val set that changed difficulty per epoch
                        # would make its own curve unreadable. false = the
                        # mixture exactly as rendered, i.e. every run up to
                        # 2026-08-29. Needs no new audio: the noise bed comes
                        # back as mixture - target - interferer, and only the
                        # mixture changes, never the reference. Costs one extra
                        # windowed read per trial and saves a duplicate one.
                        # decisions-m2.md 2026-08-30.
  num_workers: 0        # DataLoader workers. 0 on the laptop: 4 cores, already
                        # saturated by the model. Raise on GPU (the Kaggle
                        # notebook sets 4) or the wav reads starve the device.
  batch_size: 3        # decisions-m1.md 2026-08-18, provisional on GPU memory
                       # and should be 12. Still 3: the laptop has no usable GPU
                       # (docs/run_times.md). Raise to 12 when running `--split
                       # mid` or `full` on Kaggle -- and note w's absent-rate
                       # calibration assumed batch 12, where ~1.5 % of batches
                       # have no absent crop at the measured 0.297 absent rate.
   
model:
  bands:                # task #1 — plan is inherited and unjustified, see decisions-m1.md
    plan: wesep_16k
  separator:
    feature_dim: 128    # N, Yu et al. §4.2 for the 16 kHz model
    num_repeat: 6       # six-layer band + sequence module
    lstm_hidden: 192
    causal: true 
    norm: cLN
  mask:
    mlp_hidden: 384     # Tanh + GLU output
    residual_branch: true   # S = M (x) X + R, paper eq. 2
  stft:
    n_fft: 512          # 32 ms at 16 kHz (Yu et al., Interspeech 2023 §4.2), consider making this larger at 1024 as we have the budget for it
    hop: 128            # 8 ms
  lookahead_frames: 0   # 0-16. Each frame = one hop = 8 ms.
  tfmap_scale: 16.0      # scale factor for the attention logits in TFMap, see src/models/conditioning.py
  context_embedding: true    # ITEM 1c. Builds BSRNN_TFMAP_CONTEXT instead of
                             # BSRNN_TFMAP. Its forward REQUIRES enrol_embedding,
                             # so a script that has not been taught to supply one
                             # gets a TypeError rather than silently running an
                             # UNCONDITIONED model that still scores.
                             # decisions-pending.md E8.
  context_embedding_dim: 192 # asserted against the snapshot at startup, not
                             # trusted: a different ECAPA would change it.
  context_normalise: true    # L2-normalise before the projection. Only the
                             # DIRECTION carries identity; the magnitude varies
                             # with the enrolment's length and level. The
                             # un-normalised form is a one-line ablation.
  # ecapa_dir:               # absent => resolved automatically, trying the
                             # configured path, then <repo>/ecapa_pretrained
                             # (where the Kaggle bundle stages it), then the
                             # sibling ../ecapa_pretrained (where it lives
                             # locally). See resolve_ecapa_dir().
  # ecapa_sha256:            # optional pin. The hashes are recorded in
                             # meta.yaml on every run regardless, so a silent
                             # weights change is detectable after the fact.
  tfmap_part_scales: [6.9402, 0.5073, 1.2803]
                         # DERIVED 2026-09-22, scripts/derive_cue_scales.py over
                         # 200 sir0_val crops, NOT chosen. Order: direction,
                         # match_fraction, unmatched. Criterion: match each
                         # channel's RMS to the RMS of the Re/Im channels it is
                         # concatenated with, because ChannelWiseLayerNorm
                         # standardises by a STANDARD DEVIATION, so a channel's
                         # influence is governed by its spread.
                         #
                         # MEASURED EFFECT, the reason this is not cosmetic --
                         # share of the separator's input each channel drives:
                         #   direction        0.6 % ->  26.8 %
                         #   match_fraction 134.9 % ->  98.0 %
                         #   unmatched        4.4 % ->   8.8 %
                         # against the OLD single cue's 50.9 %. Without this the
                         # channel carrying the target's spectral shape is
                         # effectively invisible to the separator.
                         #
                         # CHECKABLE, not merely plausible: `direction` is
                         # unit-norm over F bins, so its per-bin RMS is exactly
                         # 1/sqrt(257) = 0.0624, and the derivation measured
                         # 0.0624.
                         #
                         # THE 2026-09-22 2-EPOCH PROBE RAN WITHOUT THIS KEY,
                         # i.e. at all ones. Its archived config travels with its
                         # results directory, so that run stays reproducible; do
                         # NOT compare its curves to a scaled run's.
                         #
                         # RESIDUAL IMBALANCE IS EXPECTED AND NOT A BUG.
                         # match_fraction is CONSTANT across bins within a frame
                         # while Re/Im vary, and a constant shifts a
                         # mean-subtracting normalisation more than a varying
                         # channel of the same RMS does. Equal RMS therefore does
                         # not mean equal share. Say that rather than tuning the
                         # numbers until the shares match.
  tfmap_parts: true      # ITEM 1a. The cue supplies 3 channels (direction,
                         # match_fraction, unmatched) instead of 1, so the
                         # network input is 5 wide, not 3. Absent or false
                         # everywhere else, which is what every run up to
                         # 2026-09-22 trained.

loss:
  # M2 objective, decisions-m2.md 2026-08-20. Six deviations from CARTSE
  # recorded there; the deviations are in src/models/losses.py, the numbers here.
  w:     0.458          # weight on the absent half. Deviation 5: 0.297 absent
                    # rate carried through CARTSE's eta = 2.0. NOTE the measured
                    # rate on mid_train is 0.3028 (val 0.2850), so this is
                    # slightly off its own derivation. Not re-derived before the
                    # warmup run: changing two things at once would make the
                    # result uninterpretable. decisions-m2.md 2026-08-25.
  # w_schedule DELETED for the fine-tune: w is constant 0.458 from step 0.
  # See the header for why the warmup must not re-run.
  w_m:   9.62          # weight on L_MR inside the present branch. MEASURED at
                    # the do-nothing anchor over 300 crops, 2026-08-20:
                    # L_pres -5.909 dB, L_MR 0.1842, target ratio 0.3
  w_g:   1.69           # weight on L_gain inside the present branch.
                        # DERIVED, not chosen: scripts/derive_w_g.py over 200
                        # sir0_val crops, 2026-08-28. Full numbers in
                        # experiments/results/2026-08-28-wg-anchor-sir0/ and
                        # decisions-m2.md 2026-08-28.
                        # Muting the mixture to the epoch-7 checkpoint's level
                        # BOUGHT 8.639 on the absent branch and a further 0.155
                        # on L_MR, against zero opposition. Break-even is 1.242;
                        # above that the mute costs more than it earns. 1.69 is
                        # the geometric midpoint of [1.242, 2.297], so it sits
                        # clear of both edges. Cross-check: the marginal bound
                        # w/(1-w) = 0.845 agrees in magnitude.
  gain_delta_db: 3.0    # L_gain deadzone half-width. Inside +-3 dB of the
                        # target's level the term is exactly 0, so it spends no
                        # gradient on errors nobody can hear.
                        # NOTE dB, NOT percent: 10 % amplitude is 0.83 dB, which
                        # is tighter than a listener can resolve. +-3 dB is an
                        # amplitude range of 0.71x-1.41x.
  ablate_w_g:   [0.0, 1.69, 2.30]   # 0 arm required. 1.69 = shipped value,
                                    # 2.30 = the ceiling, i.e. the point past
                                    # which level outweighs content
  tau_pres: 0.001       # floor inside L_pres only: caps the present reward at
                        # 30 dB. Was a single `tau` shared by both halves;
                        # split 2026-08-25.
  tau_abs:  0.01        # floor inside L_abs only: caps the SILENCE reward at
                        # 20 dB. Measured to be powerless against the mute
                        # collapse (the binding penalty is at the loud end, not
                        # the quiet end) -- kept as a separate knob, not as a
                        # fix. decisions-m2.md 2026-08-25.
  p:     0.3          # magnitude compression, Yu et al. Interspeech 2023 eq (3)
  windows_ms: [8, 16, 32, 64]   # multi-resolution window set, straddles the
                    # model's own 32 ms framing (Deviation 6)
  complex_term: real_plus_imag   # L1(real) + L1(imag), NOT the modulus. eq (3)
                                 # leaves the complex term uncompressed
  reduction:    mean             # over (F, N) only, never over the batch --
                                 # the masked means need per-example values
  ablate_w_m:   [0.0, 2.89, 9.62]   # the 0 arm is required

  # ---- D10: the interference weight. decisions-m2.md 2026-10-02 ----
  w_interf: 2.0         # how many times an error that sounds like the OTHER
                        # speaker counts in L_pres. 1.0 = e21's objective.
                        # Needs data.both_directions or remix_gains (asserted).

  # ---- AB-SDR: the artefact weight. decisions-m2.md 2026-10-03 ----
  w_artif: 4.0          # how many times error that NO source explains counts in
                        # L_pres. ENERGY weight: Ochiai's alpha = 2 -> 4.0.
                        # 1.0 = unchanged. Needs the other stem (asserted).

  # ---- D17: the mask-structure term. decisions-pending.md 2026-09-13 ----
  # MEASURED: 84.2 % of the mask's variance is one number per frame, and it
  # varies 6.5x less across frequency than the ideal mask -- a broadband volume
  # knob, which cannot separate two voices overlapping in time and frequency.
  # Measured 2026-09-13 across ~2k / ~5k / ~10k training trials: MORE DATA MAKES
  # IT WORSE (freq/time -0.162 [-0.205, -0.118] at matched epoch), so this is the
  # objective's own optimum and not a data shortage.
  #
  # SHIPPED AT 0.0. The term is COMPUTED and LOGGED at zero weight (log_struct)
  # but contributes no gradient, exactly as L_gain was shipped off while
  # derive_w_g.py read it. Set this from scripts/derive_w_struct.py against a
  # measured anchor -- never by hand, and never before that script has run.
  w_struct: 0.0
  struct_floor_db: -40.0   # a mixture bin this far under the clip's peak is
                           # treated as silent and excluded. |target|/|mixture|
                           # is meaningless where the denominator is noise.
  log_struct: true         # compute and log L_struct even at w_struct 0. One
                           # extra STFT pair per batch; measure the step-time
                           # cost before quoting it.
  ablate_w_struct: [0.0]   # filled in once the weight is derived. The 0 arm is
                           # the baseline and is required.

training:
  amp: true             # Automatic Mixed Precision: fp16 for the model forward,
                        # fp32 for the master weights and for the whole loss.
                        # Measured 1.58x on the T4 (4.741 -> 2.993 s/step) and
                        # 1.86x less memory. MUST stay config-driven: it changes
                        # training numerics, so a run's history is only readable
                        # next to the flag that produced it. CUDA-only; ignored
                        # on CPU. decisions-pending.md E3d.
  lr: 0.000125          # e21's own lr at epoch 21, so the fine-tune continues at it
  epochs: 6
  init_weights: models/model_sir0_cuecontext-wer-e21.pt   # weights only, fresh optimiser
  patience: 10
  grad_clip: 5.0
  weight_decay: 1.0e-4  # 0.0 until 2026-08-31. Turned on as the second half of
                        # the response to memorisation: more data attacks the
                        # numerator, weight decay attacks the capacity. AdamW's
                        # 0.01 default would decay every LSTM weight, which is
                        # why it was refused before -- 1e-4 is two orders below
                        # that, deliberately timid.
                        # CONFOUND, stated: this run changes data volume AND
                        # regularisation together, so an improvement cannot be
                        # attributed between them. Accepted because both attack
                        # the same hypothesis (too much capacity for the data)
                        # and a workable checkpoint matters more than a clean
                        # ablation with 6 weeks to freeze. decisions-m2.md
                        # 2026-08-31.
                        # NOTE dropout is NOT the other "free regulariser":
                        # no dropout exists in src/models/ or this config, so
                        # adding it means editing the architecture frozen on
                        # 2026-08-28. project-state.md's claim that both are
                        # config-level is wrong.
  # lr_schedule_on: present_branch
  #   WHICH NUMBER ReduceLROnPlateau WATCHES. Absent => `total`, which is what
  #   every run before 2026-09-21 used and what this file must keep so its
  #   curves stay comparable.
  #
  #   `total` IS THE WRONG NUMBER and the project already knows it. It contains
  #   L_abs, L_abs rewards silence, and selection_score's docstring spends two
  #   paragraphs on why that cannot rank a model -- the total keeps falling as
  #   the model goes quiet long after separation stopped improving. Selection
  #   was fixed 2026-08-30; the schedule was not, so the two disagreed for three
  #   weeks. MEASURED: the 14.73 M run halved its lr at epoch idx 13 on it.
  #
  #   NOT `separation` (L_pres alone) either, though it is available: measured
  #   2026-08-30 and rejected because it is computed only on target-present
  #   crops, so it leaves absent behaviour unconstrained. A schedule watching
  #   only separation holds the lr up while the model learns to shout through
  #   silence.
  #
  #   New arms should set `present_branch`, matching select_on so the schedule
  #   and the selector cannot drift apart again. decisions-m2.md 2026-09-21.
  lr_schedule_on: content_wer   # 2026-09-23: was present_branch. That number
                                # kept 1a's epoch 9, which is worse than doing
                                # nothing on content. decisions-m2.md.
                        # SET, 2026-09-22, because this file is a new arm and the
                        # block above says new arms must. It was inherited
                        # COMMENTED OUT from bsrnn_baseline.yaml on 2026-09-22
                        # and the first Kaggle attempt therefore ran with the
                        # schedule on `total` while select_on was already
                        # `present_branch` -- the two watching different numbers,
                        # which is the exact drift 31655e5 existed to end.
                        #
                        # CONSEQUENCE TO CARRY: the 2026-09-04 baseline of record
                        # ran with the schedule on `total`, because the fix did
                        # not exist yet. So this arm's lr TRAJECTORY may diverge
                        # from its control's. That is accepted deliberately --
                        # the alternative is knowingly scheduling on a number the
                        # project has already shown cannot rank a model. State it
                        # in the write-up rather than discovering it in a viva.
                        #
                        # It cannot affect a 2-epoch probe either way:
                        # lr_patience is 3, so ReduceLROnPlateau cannot fire
                        # inside two epochs whatever it is watching.
  lr_factor: 0.5        # ReduceLROnPlateau on val total
  lr_patience: 3        # must stay < patience or training stops before the
                        # lr ever drops

  # MODEL SELECTION -- which epoch's weights get kept, and when to stop. This is
  # NOT the training objective and it is never backpropagated: validation runs
  # under no_grad. `w` = 0.458 balances GRADIENTS between the two branches; it
  # was never derived to rank finished models, and ranking with it kept a
  # checkpoint at 1.13 dB held-out separation when the same run reached 2.36 dB
  # (remix arm, 2026-08-30). decisions-m2.md 2026-08-30.
  select_on: content_wer      # content_wer | present_branch | total | separation.
                              # 2026-09-23: was present_branch. 1c's own e5 was
                              # selected by it and lands the requested speaker
                              # 53.9 % of the time; e12, which it rejected,
                              # reaches 67.1 %. Same failure as 1a.
                              # `total` = the pre-2026-08-30 behaviour, kept so
                              # the old runs remain reproducible.
                              # `separation` = L_pres alone; available and NOT
                              # advised -- it is blind to absent crops, which
                              # are a quarter of the trials.
  select_abs_max: -10.0       # Silence bar, in L_abs. An epoch is only eligible
                              # to be kept if it is at least this quiet on
                              # target-absent crops. A CONSTRAINT rather than a
                              # second weighting: "quiet enough, then the best
                              # separator". null disables it.
  keep_stride: 3              # ALSO keep every 3rd epoch, and the last,
                              # regardless of score. 1a's best content epoch
                              # ranked 10th of 14, so a score-ordered cut
                              # discards it. ~87 MB each.
  keep_top_k: 3               # Also keep the k best eligible epochs as
                              # model_<split>_e{NNN}.pt. Insurance: the criterion
                              # is a judgement call, and re-scoring a run later
                              # needs the weights to still exist. 0 disables.

# VALIDATION WORD ERROR RATE, IN THE LOOP. Added 2026-09-23 for the 1c rerun.
# The scheduler and the selector both read `content_wer` (see training:), so
# every_n_epochs MUST stay 1 -- ReduceLROnPlateau needs a number every epoch.
# Cost, MEASURED 2026-09-23 on this laptop: ~4 s/clip for the ASR on cpu, so
# 40 clips is ~2.7 min. Extraction is the cheap half on a T4 (it is ~16 s/clip
# on cpu, which is why this number is a Kaggle number, not a laptop one).
# Against a 2,575 s epoch that is ~7 %, i.e. ~48 min on a 16-epoch run.
# Halve it with n_trials: 24, or set asr_device: cuda -- much faster, but then
# the transcripts are NOT the reported instrument's.
content_probe:
  enabled: true
  split: sir0_val        # never a holdout -- train.py refuses those
  condition: both
  n_trials: 40
  every_n_epochs: 1
  asr_device: cpu        # cpu keeps it identical to the reported instrument
  ema_span: 3
