# The offline ASR behind the report's tables: faster-whisper large-v3-turbo (decisions-m3.md 2026-09-28).
#   scripts/evaluate.py --config experiments/configs/eval_offline_asr_turbo.yaml --est <estimate folder>
# small.en is not used here, because the extension's checkpoint selection was tuned against it, so it is not an independent listener.
# Never compare a number from this listener with a small.en number: they are different instruments.

seed: 42                    # provenance only, because scoring is deterministic
split: sir0_val             # the report's 103 `both` trials
condition: both
metrics: content            # WER, ICR@2, mean leak and FR@2
listener: asr               # a stand-in for the judge, never a live-model result
asr_model: large-v3-turbo   # int8, cpu, greedy decoding (src/live_model_metric/evaluate.py)
