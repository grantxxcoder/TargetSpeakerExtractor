# Mixture generator parameters. What each value means and where it came from: docs/data/data-construction-parameters.md.
# [low, high] is drawn uniformly per trial, and a single value is fixed.

seed: 42
sample_rate: 16000

paths:
  librispeech: data/librispeech/LibriSpeech
  wham_noise: data/wham_noise_16k
  splits: experiments/configs/splits.yaml

# What counts as speech, for overlap, activity, the noise screen and the speech gate (decisions-m0.md 2026-08-15).
# Changing anything here invalidates the VAD index and every manifest built from it.
vad:
  min_silence_duration_ms: 250   # a pause this long counts as stopping talking, which gives phrase-level turns
  threshold: 0.5                 # Silero's default speech probability
  min_speech_duration_ms: 100    # below Silero's 250 so short words such as "yes" are kept
  speech_pad_ms: 30              # Silero's default
  expected_model_version: 6.2.1  # the weights every overlap figure came from

# Noise beds whose longest unbroken run of speech reaches this many seconds are dropped (decisions-m0.md 2026-08-16).
noise_speech_rejection:
  max_speech_run_s: 0.5

defaults:
  mixture_length_s: [15.0, 20.0]       # near REAL-TSE's clip length
  overlap_ratio: [0.0, 0.7]            # clipped per trial to target_activity_ratio; the 0.7 ceiling matches REAL-TSE on purpose (B9)
  overlap_tolerance: 0.03              # a trial missing its requested overlap by more than this is redrawn
  target_activity_ratio: [0.15, 0.78]  # the ceiling is the most a ~86 % speech corpus can reach (decisions-m0.md 2026-08-16)
  activity_tolerance: 0.1
  max_utterances_per_source: 6
  sir_db: [-5.0, 15.0]                 # target level minus interferer level; the sir0 splits override it
  snr_db: [0.0, 20.0]
  target_loudness_lufs: [-33.0, -25.0] # BS.1770 loudness of the anchor (decisions-m0.md 2026-08-12)
  t60_s: [0.25, 0.6]
  room_length_m: [5.0, 10.0]
  room_width_m: [5.0, 10.0]
  room_height_m: [3.0, 4.0]
  source_distance_m: [0.1, 2.0]        # horizontal distance from the mic
  source_height_m: [0.9, 1.8]
  mic_height_m: [0.9, 1.8]
  enrollment_length_s: 5.0             # fixed (decisions-m0.md 2026-08-12)
  enrollment_eq_prob: 0.5              # chance of a random EQ on the enrolment, standing in for another microphone
  same_gender_fraction: 0.5
  # B9's four trial types (decisions-m0.md 2026-08-13). The two zero-overlap types are equal, so overlap says nothing about absence.
  composition:
    both: 0.50
    target_only: 0.25
    interferer_only: 0.20
    noise_only: 0.05

# n_trials is how many to draw and noise_split is the WHAM! pool, never shared between training and evaluation.
# speakers_from borrows another split's speakers from splits.yaml. A regime is drawn once per trial; base narrows the ranges and hard keeps the defaults (B12).
# regimes: null draws every parameter from the wide ranges, which is how the eval splits work (decisions-m0.md 2026-08-13).
splits:
  # sir0 centres the target-to-interferer level on zero, so "keep the louder voice" is a coin flip and only the enrolment can say who to keep (decisions-m2.md 2026-08-25).
  sir0_train:
    n_trials: 10000
    noise_split: tr
    speakers_from: train
    sir_db: [-10.0, 10.0]
    regimes:
      weights: {base: 0.6, hard: 0.4}
      base:
        snr_db: [8.0, 20.0]
        t60_s: [0.25, 0.5]
        source_distance_m: [0.1, 2.0]
        target_activity_ratio: [0.45, 0.78]
  sir0_val:
    n_trials: 200
    noise_split: cv
    speakers_from: val
    sir_db: [-10.0, 10.0]
    regimes:
      weights: {base: 0.6, hard: 0.4}
      base:
        snr_db: [8.0, 20.0]
        t60_s: [0.25, 0.5]
        source_distance_m: [0.1, 2.0]
        target_activity_ratio: [0.45, 0.78]
  eval_public:  {n_trials: 500, noise_split: tt, regimes: null}
  eval_private: {n_trials: 500, noise_split: tt, regimes: null}
